# Cloudflare Quick Tunnel - publica o gateway do lab na internet
# Permite ThousandEyes Cloud Agents testarem de fora pra dentro (onprem sem abrir porta no firewall)
#
# NAO precisa de conta, dominio, nem token. O cloudflared pede uma URL efemera
# em *.trycloudflare.com e sobe a conexao de saida (egress) ate a Cloudflare.
#
#   make tunnel        sobe o tunnel
#   make tunnel-url    imprime a URL publica (sai no log do cloudflared)
#
# A URL MUDA a cada restart do container. Se precisar de hostname fixo, use o
# tunnel nomeado (docker-compose.tunnel-named.yml) - esse exige dominio na
# Cloudflare e token, veja o README.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: obs-cloudflared
    command: tunnel --no-autoupdate --url http://gateway-service:8080
    restart: unless-stopped
    networks: [obs-net]
    depends_on: [gateway-service]
