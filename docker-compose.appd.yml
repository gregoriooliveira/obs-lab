# Apenas AppDynamics – APM nos 3 tiers + machine agent
services:
  gateway-service:
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME:     "${APPDYNAMICS_CONTROLLER_HOST_NAME}"
      APPDYNAMICS_CONTROLLER_PORT:          "${APPDYNAMICS_CONTROLLER_PORT:-443}"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED:   "${APPDYNAMICS_CONTROLLER_SSL_ENABLED:-true}"
      APPDYNAMICS_AGENT_ACCOUNT_NAME:       "${APPDYNAMICS_AGENT_ACCOUNT_NAME}"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY}"
      APPDYNAMICS_AGENT_APPLICATION_NAME:   "${APPDYNAMICS_AGENT_APPLICATION_NAME:-obs-lab}"
      APPDYNAMICS_AGENT_TIER_NAME:          "gateway"
      APPDYNAMICS_AGENT_NODE_NAME:          "gateway-node-1"
  orders-service:
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME:     "${APPDYNAMICS_CONTROLLER_HOST_NAME}"
      APPDYNAMICS_CONTROLLER_PORT:          "${APPDYNAMICS_CONTROLLER_PORT:-443}"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED:   "${APPDYNAMICS_CONTROLLER_SSL_ENABLED:-true}"
      APPDYNAMICS_AGENT_ACCOUNT_NAME:       "${APPDYNAMICS_AGENT_ACCOUNT_NAME}"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY}"
      APPDYNAMICS_AGENT_APPLICATION_NAME:   "${APPDYNAMICS_AGENT_APPLICATION_NAME:-obs-lab}"
      APPDYNAMICS_AGENT_TIER_NAME:          "orders"
      APPDYNAMICS_AGENT_NODE_NAME:          "orders-node-1"
  payment-service:
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME:     "${APPDYNAMICS_CONTROLLER_HOST_NAME}"
      APPDYNAMICS_CONTROLLER_PORT:          "${APPDYNAMICS_CONTROLLER_PORT:-443}"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED:   "${APPDYNAMICS_CONTROLLER_SSL_ENABLED:-true}"
      APPDYNAMICS_AGENT_ACCOUNT_NAME:       "${APPDYNAMICS_AGENT_ACCOUNT_NAME}"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY}"
      APPDYNAMICS_AGENT_APPLICATION_NAME:   "${APPDYNAMICS_AGENT_APPLICATION_NAME:-obs-lab}"
      APPDYNAMICS_AGENT_TIER_NAME:          "payment"
      APPDYNAMICS_AGENT_NODE_NAME:          "payment-node-1"

  appd-machine-agent:
    image: appdynamics/machine-agent:latest
    container_name: obs-appd-machine-agent
    privileged: true
    # root: sem isso o agent nao le /var/run/docker.sock (Permission denied no /info)
    user: "0:0"
    environment:
      APPDYNAMICS_CONTROLLER_HOST_NAME:     "${APPDYNAMICS_CONTROLLER_HOST_NAME}"
      APPDYNAMICS_CONTROLLER_PORT:          "${APPDYNAMICS_CONTROLLER_PORT:-443}"
      APPDYNAMICS_CONTROLLER_SSL_ENABLED:   "${APPDYNAMICS_CONTROLLER_SSL_ENABLED:-true}"
      APPDYNAMICS_AGENT_ACCOUNT_NAME:       "${APPDYNAMICS_AGENT_ACCOUNT_NAME}"
      APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY: "${APPDYNAMICS_AGENT_ACCOUNT_ACCESS_KEY}"
      APPDYNAMICS_AGENT_APPLICATION_NAME:   "${APPDYNAMICS_AGENT_APPLICATION_NAME:-obs-lab}"
      APPDYNAMICS_SIM_ENABLED:              "true"
      APPDYNAMICS_DOCKER_ENABLED:           "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostroot/proc:ro
      - /sys:/hostroot/sys:ro
    restart: unless-stopped
    networks: [obs-net]
