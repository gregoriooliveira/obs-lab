# obs-lab - cadeia de microservicos
# gateway (8080) -> orders (8081) -> payment (8082)
# gateway com IP fixo 172.20.0.10 para testes externos (ThousandEyes API test)

# Nome do projeto FIXO: sem isso o compose usa o nome do diretorio e as imagens
# saem como <dir>-gateway-service. O k8s-lab.sh/.ps1 faz `kind load
# obs-lab-gateway-service:latest` e quebraria em qualquer pasta com outro nome.
name: obs-lab

services:

  gateway-service:
    build: { context: ./services/gateway }
    image: obs-lab-gateway-service:latest
    container_name: obs-gateway
    ports:
      - "8080:8080"
    environment:
      APP_PORT: 8080
      OTEL_SERVICE_NAME: gateway-service
      ORDERS_URL: http://orders-service:8081
      LATENCY_JITTER_MS: "${LATENCY_JITTER_MS:-150}"
      # auth + auditoria de fraude (users / security_events) vivem no Postgres
      DB_HOST: inventory-db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-obslab}"
      DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      DB_NAME: "${DB_NAME:-inventory}"
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      obs-net:
        ipv4_address: 172.20.0.10

  inventory-db:
    image: postgres:16-alpine
    container_name: obs-inventory-db
    # pg_stat_statements: exigido pelo Database Query Performance (top query)
    # do OTel postgresql receiver. Precisa de preload no start do servidor.
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.track=all"
      - "-c"
      - "pg_stat_statements.max=10000"
    environment:
      POSTGRES_USER: "${DB_USER:-obslab}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      POSTGRES_DB: "${DB_NAME:-inventory}"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - inventory-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-obslab} -d ${DB_NAME:-inventory}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [obs-net]

  orders-service:
    build: { context: ./services/orders }
    image: obs-lab-orders-service:latest
    container_name: obs-orders
    ports:
      - "8081:8081"
    environment:
      APP_PORT: 8081
      OTEL_SERVICE_NAME: orders-service
      PAYMENT_URL: http://payment-service:8082
      ERROR_RATE: "${ERROR_RATE:-0.06}"
      LATENCY_JITTER_MS: "${LATENCY_JITTER_MS:-150}"
      DB_HOST: inventory-db
      DB_PORT: "5432"
      DB_USER: "${DB_USER:-obslab}"
      DB_PASSWORD: "${DB_PASSWORD:?defina DB_PASSWORD no .env}"
      DB_NAME: "${DB_NAME:-inventory}"
    depends_on:
      inventory-db:
        condition: service_healthy
    restart: unless-stopped
    networks: [obs-net]

  payment-service:
    build: { context: ./services/payment }
    image: obs-lab-payment-service:latest
    container_name: obs-payment
    ports:
      - "8082:8082"
    environment:
      APP_PORT: 8082
      OTEL_SERVICE_NAME: payment-service
      ERROR_RATE: "${ERROR_RATE:-0.10}"
      LATENCY_JITTER_MS: "${LATENCY_JITTER_MS:-150}"
    restart: unless-stopped
    networks: [obs-net]

  load-gen:
    build: { context: ./load-gen }
    image: obs-lab-load-gen:latest
    container_name: obs-load-gen
    environment:
      TARGET_URL: "http://gateway-service:8080"
      VIRTUAL_USERS: "${LOAD_VUS:-8}"
      THINK_TIME_MS: "${THINK_TIME_MS:-400}"
      STATS_INTERVAL_S: "${STATS_INTERVAL_S:-30}"
      FRAUD_ENABLED: "${FRAUD_ENABLED:-true}"
    depends_on: [gateway-service]
    restart: unless-stopped
    networks: [obs-net]

networks:
  obs-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  inventory-data:
