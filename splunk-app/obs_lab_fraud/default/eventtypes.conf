# Eventtypes CIM. A tag vem do tags.conf; e o que liga estes eventos aos data
# models Authentication e Web e aos eventtypes do Security Essentials.
[obs_lab_authentication]
search = sourcetype="obs-lab:container" logger=security event_type=login (outcome=success OR outcome=fail OR blocked=true)

[obs_lab_web]
search = sourcetype="obs-lab:container" logger=http
