# Deteccoes de fraude do obs-lab.
#
# Sem ES e sem KVStore: cada busca e um alerta agendado com alert.track=1, entao
# o disparo aparece em Activity > Triggered Alerts, que e o mais perto de um
# notable que Splunk Enterprise puro entrega. O `risk_score` ja vem calculado
# pelo gateway - as buscas agregam, nao recalculam.
#
# Cron desencontrado (1,2,3...) pra nao disparar as 7 buscas no mesmo minuto num
# lab de 15 GB.

[Fraude - Brute force de login]
search = `obs_lab_fraud` threat=brute_force \
| stats max(risk_score) as risk_score, count as tentativas, values(username) as usuarios, latest(detail) as detalhe by client_ip \
| where tentativas >= 3 \
| sort - risk_score
description = Rajada de logins falhos pelo mesmo IP. O gateway ja bloqueia acima de risk_score 70; aqui o alerta e o registro para o analista.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 1-56/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Account takeover (IP novo)]
search = `obs_lab_fraud` threat=account_takeover \
| stats count as logins, values(client_ip) as ips, latest(detail) as detalhe, max(risk_score) as risk_score by username \
| sort - risk_score
description = Login bem-sucedido de um IP diferente do ultimo usado pela conta. Sozinho nao prova fraude - vale como sinal correlacionado com brute force no mesmo usuario.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 2-57/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Adulteracao de preco no checkout]
search = `obs_lab_fraud` threat=price_tampering \
| rex field=detail "sent=(?<preco_enviado>[\d.]+) real=(?<preco_real>[\d.]+) diff=(?<prejuizo>[\d.]+)" \
| stats count as tentativas, sum(prejuizo) as prejuizo_evitado, values(product_id) as produtos by client_ip \
| sort - prejuizo_evitado
description = Cliente enviou preco diferente do catalogo. Sempre bloqueado (risk_score 95); o valor somado e o prejuizo que a deteccao evitou.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 3-58/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Card testing]
search = `obs_lab_fraud` threat=card_testing \
| stats count as tentativas, max(risk_score) as risk_score, avg(amount) as ticket_medio, latest(detail) as detalhe by client_ip \
| eval ticket_medio = round(ticket_medio, 2) \
| sort - risk_score
description = Rajada de pagamentos de valor baixo pelo mesmo IP - padrao classico de teste de cartao roubado.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 4-59/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Velocity abuse em pedidos]
search = `obs_lab_fraud` threat=velocity_abuse \
| stats count as eventos, max(risk_score) as risk_score, values(client_ip) as ips, latest(detail) as detalhe by username \
| sort - risk_score
description = Volume de pedidos por cliente acima do humano em 60s.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 0-55/5 * * * *
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Bot scraping do catalogo]
search = `obs_lab_fraud` threat=bot_scraping \
| stats count as requisicoes, max(risk_score) as risk_score, values(user_agent) as user_agents, sum(eval(if(blocked="true",1,0))) as bloqueadas by client_ip \
| where requisicoes >= 10 \
| sort - requisicoes
description = Raspagem do catalogo por User-Agent de ferramenta (curl, python, scrapy). Ruidoso de proposito - serve para mostrar triagem por risk_score, nao para alertar em producao.
dispatch.earliest_time = -5m@m
dispatch.latest_time = @m
cron_schedule = 5-59/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 2
counttype = number of events
quantity = 0
relation = greater than

[Fraude - Risco acumulado por IP (RBA sem ES)]
search = `obs_lab_fraud` \
| stats sum(risk_score) as risco_total, dc(threat) as tipos_de_ataque, values(threat) as ataques, count as eventos by client_ip \
| where risco_total > 300 AND tipos_de_ataque >= 2 \
| sort - risco_total
description = Emula o Risk-Based Alerting do ES: soma o risco de todas as ameacas do mesmo IP na janela. Um IP que aparece em dois ou mais fluxos distintos e o caso que vale abrir - e onde a demo mostra correlacao, nao alerta isolado.
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
cron_schedule = 7-52/15 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than
