# O gateway loga uma linha JSON por evento; o exporter splunk_hec entrega essa
# linha como _raw. Sem isso os campos so aparecem com spath manual.
[obs-lab:container]
KV_MODE = json
TIME_PREFIX = "ts":"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%3N%Z
MAX_TIMESTAMP_LOOKAHEAD = 40
SHOULD_LINEMERGE = false
TRUNCATE = 10000

# ── CIM (Authentication e Web) ───────────────────────────────────────────────
# Sem isto o Security Essentials acha o sourcetype mas os eventtypes dele
# (tag=authentication user=* action=success, tag=web) falham: as detecções
# prontas do ESCU aparecem como "disponíveis" e não acham campo nenhum.
# Só aliases e EVAL de busca - os campos originais continuam lá.
FIELDALIAS-cim_src        = client_ip AS src
FIELDALIAS-cim_user       = username AS user
FIELDALIAS-cim_status     = http_status AS status
FIELDALIAS-cim_uri_path   = http_path AS uri_path
FIELDALIAS-cim_user_agent = user_agent AS http_user_agent
EVAL-dest   = service
EVAL-app    = "obs-lab"
# Authentication: login ok = success; falha ou bloqueio (brute force/stuffing,
# que devolvem 429 sem evento de outcome) = failure. Os eventos de deteccao
# (threat=...) nao ganham action - sao o alerta, nao a tentativa.
EVAL-action = case(logger=="security" AND event_type=="login" AND outcome=="success", "success", logger=="security" AND event_type=="login" AND (outcome=="fail" OR (isnull(outcome) AND blocked=="true")), "failure")
