# Base de todas as buscas. Trocar aqui se o index/sourcetype do HEC mudar,
# em vez de editar cada saved search.
#
# SEM `spath`. O KV_MODE=json do sourcetype JA extrai os campos; o spath
# explicito extraia de novo e cada campo virava MULTIVALOR com o valor
# repetido. Medido em 2026-09-22 sobre 500 eventos:
#   sum(risk_score) sem spath = 48092
#   sum(risk_score) com spath = 96184   <- exatamente o dobro
# Ou seja, o "Risco acumulado por IP" reportava o dobro do risco real, e
# qualquer tonumber()/perc95 em cima de campo numerico vinha vazio.
[obs_lab_security]
definition = index=lab sourcetype="obs-lab:container" logger=security
iseval = 0

# So os eventos que sao fraude de fato (login ok/fail comum fica de fora).
[obs_lab_fraud]
definition = `obs_lab_security` | search threat=*
iseval = 0

# Janela padrao dos alertas. Mantida igual ao cron pra nao contar duas vezes
# nem deixar buraco entre execucoes.
[obs_lab_alert_window]
definition = earliest=-5m@m latest=@m
iseval = 0

# ── Panorama: fontes alem da fraude ──────────────────────────────────────────
# Todos os logs da aplicacao (http, security, pg, startup, degradacao).
[obs_lab_app]
definition = index=lab sourcetype="obs-lab:container"
iseval = 0

# So o access log estruturado (logger=http). E o que sustenta os numeros de
# negocio: checkout, pedido, pagamento - tudo sai do par http_path/http_status.
[obs_lab_http]
definition = `obs_lab_app` | search logger=http
iseval = 0

# Metricas do stream do ThousandEyes. Os valores vem em campos com prefixo
# "metric_name:" - o index `te` e de EVENTOS, entao mstats nao serve aqui.
[obs_lab_te]
definition = index=te sourcetype="cisco:thousandeyes:metric"
iseval = 0
