# Base de todas as buscas. Trocar aqui se o index/sourcetype do HEC mudar,
# em vez de editar cada saved search.
#
# SEM `spath`. O KV_MODE=json do sourcetype JA extrai os campos; o spath
# explicito extraia de novo e cada campo virava MULTIVALOR com o valor
# repetido. Medido em 2026-09-22 sobre 500 eventos:
#   sum(risk_score) sem spath = 48092
#   sum(risk_score) com spath = 96184   <- exatamente o dobro
# Ou seja, o "Risco acumulado por IP" reportava o dobro do risco real, e
# qualquer tonumber()/perc95 em cima de campo numerico vinha vazio.
[obs_lab_security]
definition = index=lab sourcetype="obs-lab:container" logger=security
iseval = 0

# So os eventos que sao fraude de fato (login ok/fail comum fica de fora).
[obs_lab_fraud]
definition = `obs_lab_security` | search threat=*
iseval = 0

# Janela padrao dos alertas. Mantida igual ao cron pra nao contar duas vezes
# nem deixar buraco entre execucoes.
[obs_lab_alert_window]
definition = earliest=-5m@m latest=@m
iseval = 0

# ── Panorama: fontes alem da fraude ──────────────────────────────────────────
# Todos os logs da aplicacao (http, security, pg, startup, degradacao).
[obs_lab_app]
definition = index=lab sourcetype="obs-lab:container"
iseval = 0

# So o access log estruturado (logger=http). E o que sustenta os numeros de
# negocio: checkout, pedido, pagamento - tudo sai do par http_path/http_status.
[obs_lab_http]
definition = `obs_lab_app` | search logger=http
iseval = 0

# Metricas do stream do ThousandEyes. Os valores vem em campos com prefixo
# "metric_name:" - o index `te` e de EVENTOS, entao mstats nao serve aqui.
[obs_lab_te]
definition = index=te sourcetype="cisco:thousandeyes:metric"
iseval = 0

# Splunk Synthetics (o11y). Nao passa pelo collector: vem pelo comando `| sim`
# do Splunk Infrastructure Monitoring Add-on, que roda SignalFlow na org e
# devolve na hora (nao indexa, nao conta licenca). O `|` NAO fica no macro: use
# `| `obs_lab_synth_uptime``. Query de dashboard que comeca com crase ganha um
# `search` na frente, e o sim reclama que nao e o primeiro comando. Dimensoes do synthetics.run.*: test, test_id, test_type,
# location, location_id, success, failed. Filtro OBS-LAB-* = so os testes do lab.
# Saida normalizada para _time, test, location, valor.
[obs_lab_synth_uptime]
definition = sim flow query="data('synthetics.run.uptime.percent', filter=filter('test', 'OBS-LAB-*')).mean(by=['test', 'location']).publish()" resolution=60000 \
| rename _value as valor
iseval = 0

[obs_lab_synth_duration]
definition = sim flow query="data('synthetics.run.duration.time.ms', filter=filter('test', 'OBS-LAB-*')).mean(by=['test', 'location']).publish()" resolution=60000 \
| rename _value as valor
iseval = 0

# Execucoes que falharam (failed=true), somadas por teste e location.
[obs_lab_synth_failed]
definition = sim flow query="data('synthetics.run.count', filter=filter('test', 'OBS-LAB-*') and filter('failed', 'true')).sum(by=['test', 'location']).publish()" resolution=60000 \
| rename _value as valor
iseval = 0

# AppDynamics, pelo Cisco Splunk Add-on for AppDynamics (Splunk_TA_AppDynamics).
# Inputs obs_lab_status (Status: application/tier/node/BT/remote services) e
# obs_lab_events (health rule violations + snapshots de requisicao lenta,
# type=REQUEST_SEGMENT_DATA com experience=SLOW|VERY_SLOW), a cada 300s com janela de 5 min -
# janela de 1 min devolvia callsPerMinute=0 porque o minuto ainda nao fechou no
# controller. tier_status vem com callsPerMinute=0 sempre: volume por tier sai
# da soma das BTs. Indice `appdynamics`, o que os paineis do proprio add-on leem.
# Campos ja vem extraidos (JSON) - sem spath, mesma armadilha do obs_lab_security.
[obs_lab_appd]
definition = index=appdynamics sourcetype=appdynamics_status
iseval = 0

[obs_lab_appd_events]
definition = index=appdynamics sourcetype!=appdynamics_status
iseval = 0
