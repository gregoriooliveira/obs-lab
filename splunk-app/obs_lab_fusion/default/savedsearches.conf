# ── TI (web store / portal) - casos que usam o dado de TI que ja existe ──────

[TI - Cadeia do cliente: endpoint do portal sem trafego]
search = `obs_lab_http` \
| stats count as req, max(_time) as ult by http_path \
| eval mins_sem_trafego = round((now()-ult)/60, 1) \
| where req > 5 AND mins_sem_trafego > 3 \
| sort - mins_sem_trafego
description = Rota de negocio do portal (checkout, pagamento, pedido) que tinha trafego e parou (interface caiu a zero) - a falha de integracao aparece aqui antes de virar reclamacao. Observabilidade da cadeia com impacto no cliente.
dispatch.earliest_time = -15m@m
dispatch.latest_time = now
cron_schedule = 9-54/15 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
quantity = 0
relation = greater than

[TI - Acesso massivo a contas no portal (LGPD)]
search = `obs_lab_security` \
| stats dc(username) as contas_distintas, count as tentativas, values(threat) as ameacas by client_ip \
| where contas_distintas >= 10 \
| sort - contas_distintas
description = Um mesmo IP tocando muitas contas distintas no portal = acesso massivo / enumeracao (exfiltracao de dados de consumidor, LGPD), tambem a assinatura de credential stuffing. Relatorio para o encarregado de dados (DPO).
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
cron_schedule = 13-58/15 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
quantity = 0
relation = greater than
