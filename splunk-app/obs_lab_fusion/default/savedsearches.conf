# ── Experiencia, operacao e atendimento (energia) ───────────────────────────
# Casos de uso "criativos": a falha que o lab JA injeta vira reclamacao no
# portal, last gasp, religamento, corte etc. Ponte com a TI pela conta_portal.

[OT - Tensao baixa com reclamacao do cliente]
search = `obs_lab_ot_reclamacoes` motivo=tensao \
| stats count as reclamacoes, dc(uc) as ucs, values(essencial) as essenciais, values(conta_portal) as contas_portal by alimentador \
| sort - reclamacoes
description = Afundamento de tensao (sag) no alimentador que gera reclamacao no portal da UC afetada. Cruza a grandeza medida com a reclamacao - a UC essencial entra com prioridade. conta_portal liga ao atendimento da TI.
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = 0-50/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 3
counttype = number of events
quantity = 0
relation = greater than

[OT - Interrupcao provavel por last gasp (antes da ligacao)]
search = `obs_lab_ot_eventos` evento=last_gasp \
| stats dc(uc) as medidores_sem_energia, values(essencial) as essenciais, values(conta_portal) as contas_portal by alimentador \
| where medidores_sem_energia >= 3 \
| sort - medidores_sem_energia
description = Varios medidores do mesmo alimentador emitem last gasp (power fail) na mesma janela = interrupcao provavel, detectada ANTES da ligacao do cliente. Gera pre-ocorrencia; a UC essencial escala.
dispatch.earliest_time = -10m@m
