# Deteccoes de fraude OT e a correlacao OT+TI do obs-lab. Mesmo padrao do app
# obs_lab_fraud: cada busca e um alerta agendado (alert.track=1 -> Triggered
# Alerts, o mais perto de um notable no Splunk Enterprise puro). Cron
# desencontrado pra nao disparar junto num lab de 15 GB.
#
# PENDENTE DE VALIDACAO AO VIVO: as buscas de METRICA usam o macro
# `obs_lab_ot_metric`, cuja unica incognita e o nome da metrica
# (<measurement>.<campo>). Confirmar com `| mstats ... by metric_name` quando o
# dado fluir e, se preciso, ajustar so o macro. As de EVENTO (index=ot) e a
# ponte com a TI (campo username) usam campos ja conhecidos.

[OT - Perda nao-tecnica por alimentador]
search = | `obs_lab_ot_metric("ot_medidor.potencia_kw")` by alimentador, uc span=1m \
| stats latest(valor) as kw_uc by alimentador, uc \
| stats sum(kw_uc) as medido by alimentador \
| join type=inner alimentador [ | `obs_lab_ot_metric("ot_alimentador.potencia_kw")` by alimentador span=1m | stats latest(valor) as entregue by alimentador ] \
| eval perda = round(entregue - medido, 1), perda_pct = round((entregue-medido)/entregue*100, 1), perda_nao_tecnica_pct = round(perda_pct - 4, 1) \
| where perda_nao_tecnica_pct > 3 \
| sort - perda_nao_tecnica_pct
description = Balanco de energia: o que o alimentador entrega (Modbus) menos a soma dos medidores (MQTT). Acima de ~4% ja nao e perda tecnica - e furto. Aponta o alimentador; a UC sai pelo tamper e pela busca coordenada.
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = 9-59/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
quantity = 0
relation = greater than

[OT - Comando nao autorizado / spoof de telemetria]
search = `obs_lab_ot_cyber` \
| stats count as eventos, values(tipo) as tipos, dc(feeder) as alvos, latest(msg) as detalhe, latest(severidade) as severidade by feeder \
| sort - eventos
description = Ataque cyber no processo: comando de abertura sem origem legitima (unauth_command) ou telemetria falseada (spoof, a leitura do alimentador congela e descola do total da subestacao). Severidade critical/high.
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = 1-51/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

[OT - Medidor adulterado (tamper)]
search = `obs_lab_ot_eventos` evento=medidor_tamper \
| stats count as eventos, values(uc) as ucs, values(conta_portal) as contas_portal by alimentador \
| sort - eventos
description = Flag de adulteracao fisica no medidor (imã, bypass, firmware). A conta_portal liga a UC a conta da web store - entrada da correlacao com a TI.
dispatch.earliest_time = -10m@m
dispatch.latest_time = @m
cron_schedule = 3-53/10 * * * *
enableSched = 1
alert.track = 1
alert.severity = 4
counttype = number of events
quantity = 0
relation = greater than

[OT+TI - Fraude coordenada por UC]
search = `obs_lab_ot_eventos` evento=medidor_tamper \
| stats count as ot_tamper, values(conta_portal) as conta_portal, values(alimentador) as alimentador by uc \
| join type=inner uc [ `obs_lab_uc_fraude_ti` | stats count as ti_eventos, values(threat) as ameacas_ti, max(risk_score) as risk_ti by uc ] \
| eval caso = "coordenado OT+TI" \
| sort - risk_ti
description = O caso que nenhum centro isolado ve: a mesma UC foi adulterada no campo (tamper, OT) E sofreu fraude no portal (ATO/cartao, TI) na conta_portal correspondente. Furto silencioso (desvio baixo, sem tamper) so aparece no balanco por alimentador, nao aqui.
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
cron_schedule = 6-51/15 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than
