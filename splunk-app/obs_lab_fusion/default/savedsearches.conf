[OT+TI - Fraude coordenada por UC]
search = `obs_lab_ot_eventos` evento=medidor_tamper \
| stats count as ot_tamper, values(conta_portal) as conta_portal, values(alimentador) as alimentador by uc \
| join type=inner uc [ `obs_lab_uc_fraude_ti` | stats count as ti_eventos, values(threat) as ameacas_ti, max(risk_score) as risk_ti by uc ] \
| eval caso = "coordenado OT+TI" \
| sort - risk_ti
description = O caso que nenhum centro isolado ve: a mesma UC foi adulterada no campo (tamper, OT) E sofreu fraude no portal (ATO/cartao, TI) na conta_portal correspondente. Furto silencioso (desvio baixo, sem tamper) so aparece no balanco por alimentador, nao aqui.
dispatch.earliest_time = -15m@m
dispatch.latest_time = @m
cron_schedule = 6-51/15 * * * *
enableSched = 1
alert.track = 1
alert.severity = 5
counttype = number of events
quantity = 0
relation = greater than

