# Enriquecimento de evento com geo. Primeiro o lookup do lab (IPs de
# documentacao); o `iplocation` e o fallback para IP publico real - o trafego
# do Synthetics e do ThousandEyes chega pelo tunel com o IP da nuvem.
# `ator`: cliente | atacante (do CSV) | externo (qualquer IP fora do CSV).
# O iplocation devolve pais em ingles: Brazil viraria um no separado de Brasil
# no Sankey. Os dois que aparecem no lab sao traduzidos; o resto fica em ingles.
[obs_lab_geo_enrich]
definition = lookup obs_lab_geo cidr AS client_ip OUTPUT pais, cidade, lat, lon, ator \
| iplocation prefix=ipl_ client_ip \
| eval pais=coalesce(pais, case(ipl_Country="Brazil", "Brasil", ipl_Country="United States", "Estados Unidos", ipl_Country!="", ipl_Country), "desconhecido"), cidade=coalesce(cidade, nullif(ipl_City, ""), "-"), lat=tonumber(coalesce(lat, ipl_lat)), lon=tonumber(coalesce(lon, ipl_lon)), ator=coalesce(ator, "externo") \
| fields - ipl_*
iseval = 0

# Ameaca -> MITRE / dominio / compliance. Ameaca fora do CSV vira "nao mapeada"
# em vez de sumir do Sankey (mvappend com campo nulo descarta o par inteiro).
[obs_lab_threat_enrich]
definition = lookup obs_lab_threat threat OUTPUT dominio, mitre_id, mitre_tecnica, mitre_tatica, controle_pci, controle_lgpd \
| eval dominio=coalesce(dominio, "nao mapeado"), mitre_id=coalesce(mitre_id, "T????"), mitre_tecnica=coalesce(mitre_tecnica, threat), mitre_tatica=coalesce(mitre_tatica, "nao mapeada"), controle_pci=coalesce(controle_pci, "nao mapeado"), controle_lgpd=coalesce(controle_lgpd, "nao mapeado")
iseval = 0

# ── OT (energia): processo, eventos e a ponte com a TI ───────────────────────
# Eventos de seguranca/operacao/tamper do OT. Entram pelo Telegraf em
# /services/collector/raw?index=ot&sourcetype=ot:evento (ver ot/energia/telegraf).
[obs_lab_ot_eventos]
definition = index=ot sourcetype="ot:evento"
iseval = 0

# So os eventos de ATAQUE (comando nao autorizado, spoof de telemetria, tamper
# de medidor). Operacao normal (trip/overload/sag) fica de fora.
[obs_lab_ot_cyber]
definition = `obs_lab_ot_eventos` categoria=seguranca
iseval = 0

# Telemetria de processo (METRICA, index ot_metrics via Telegraf splunkmetric).
# ESTE E O UNICO PONTO a confirmar com o dado real: o nome da metrica segue
# "<measurement>.<campo>" (ex.: ot_alimentador.potencia_kw). Rode uma vez:
#   | mstats avg(_value) WHERE index=ot_metrics by metric_name
# e, se o Telegraf gravar so o campo (sem o measurement), tire o prefixo das
# chamadas - a forma do macro nao muda. Uso (o macro e o 1o comando do pipe):
#   | `obs_lab_ot_metric("ot_alimentador.potencia_kw")` by alimentador span=1m
[obs_lab_ot_metric(1)]
args = nome
definition = mstats avg(_value) AS valor WHERE index=ot_metrics metric_name="$nome$"
iseval = 0

# Fraude de TI que cai numa conta de UC (a ponte). `obs_lab_fraud` guarda o
# customerId no campo `username` (checkout/risk_decision: username=customerId).
# O lookup casa username -> UC, entao sobra so a fraude ligada a uma UC real.
[obs_lab_uc_fraude_ti]
definition = `obs_lab_fraud` | lookup obs_lab_uc conta_portal AS username OUTPUT uc, alimentador AS al_uc, classe | search uc=UC-*
iseval = 0
