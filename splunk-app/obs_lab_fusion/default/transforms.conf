# Geo dos IPs do lab. Os IPs sao de faixas de documentacao (RFC 5737 / 2544),
# entao `iplocation` devolve vazio - o mapa ficaria em branco sem isto.
# CIDR para cobrir os 100 usuarios legitimos (198.18.0.10-109) sem 100 linhas.
# Nenhuma faixa se sobrepoe: com CIDR sobreposto a linha escolhida depende da
# ordem do arquivo.
[obs_lab_geo]
filename = obs_lab_geo.csv
match_type = CIDR(cidr)
max_matches = 1

# Ameaca -> dominio (cyber/fraude), tecnica MITRE ATT&CK e controles de
# compliance. E a chave de juncao do Fusion Center: o mesmo evento vira linha
# de SOC, de fraude e de auditoria.
[obs_lab_threat]
filename = obs_lab_threat.csv
max_matches = 1

# Unidade Consumidora: a entidade-ponte OT<->TI. Liga a conta do portal
# (conta_portal = customerId = campo `username` na TI) ao medidor/alimentador do
# OT. Casa por conta_portal (lado TI) ou por uc (lado OT). As colunas furto/desvio
# ficam no CSV como verdade interna do lab, mas NAO sao OUTPUT nas buscas - a
# deteccao de furto vem do balanco de energia, nao da coluna. Ver ot/FRAUDE.md.
[obs_lab_uc]
filename = obs_lab_uc.csv
max_matches = 1
