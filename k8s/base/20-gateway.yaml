# gateway-service - entrada da cadeia. Exposto como NodePort 30080 (host 18080).
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: obs-lab
  labels: { app: gateway-service }
spec:
  selector: { app: gateway-service }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: obs-lab
  labels: { app: gateway-service, tier: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway-service }
  template:
    metadata:
      labels: { app: gateway-service, tier: gateway }
    spec:
      containers:
        - name: gateway
          image: obs-lab-gateway-service:latest
          imagePullPolicy: IfNotPresent    # imagem vem do `kind load`, nao de registry
          ports:
            - { name: http, containerPort: 8080 }
          env:
            # ── downward API: usado no OTLP endpoint e nos resource attributes ──
            - { name: NODE_IP,       valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NODE_NAME,     valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: APP_PORT,           value: "8080" }
            - { name: OTEL_SERVICE_NAME,  value: gateway-service }
            # lidos pelo log estruturado (deployment.environment / host.name)
            - { name: ENVIRONMENT,       value: lab-k8s }
            - { name: HOSTNAME_LAB,      value: "$(NODE_NAME)" }
            - { name: ORDERS_URL,         value: http://orders-service:8081 }
            - { name: LATENCY_JITTER_MS,  value: "150" }
            # ── DB: auth (users) + auditoria de fraude (security_events) ──
            - { name: DB_HOST, value: inventory-db }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_USER,     valueFrom: { secretKeyRef: { name: obs-lab-db, key: DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: obs-lab-db, key: DB_PASSWORD } } }
            - { name: DB_NAME,     valueFrom: { secretKeyRef: { name: obs-lab-db, key: DB_NAME } } }
            # ── Splunk: OTLP no agent DaemonSet, que escuta no IP do no ──
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(NODE_IP):4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            # correlaciona o span com pod/namespace/no -> Related Content no APM
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=lab-k8s,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            # ── AppDynamics ──
            - { name: APPDYNAMICS_AGENT_TIER_NAME, value: gateway }
            - { name: APPDYNAMICS_AGENT_NODE_NAME, value: "$(POD_NAME)" }
          envFrom:
            - secretRef: { name: appd-creds }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
