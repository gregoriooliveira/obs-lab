# payment-service - ponta da cadeia. Janela de degradacao a cada ~3min.
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: obs-lab
  labels: { app: payment-service }
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 8082, targetPort: 8082 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: obs-lab
  labels: { app: payment-service, tier: payment }
spec:
  replicas: 2
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service, tier: payment }
    spec:
      containers:
        - name: payment
          image: obs-lab-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8082 }
          env:
            - { name: NODE_IP,       valueFrom: { fieldRef: { fieldPath: status.hostIP } } }
            - { name: POD_NAME,      valueFrom: { fieldRef: { fieldPath: metadata.name } } }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NODE_NAME,     valueFrom: { fieldRef: { fieldPath: spec.nodeName } } }
            - { name: APP_PORT,          value: "8082" }
            - { name: OTEL_SERVICE_NAME, value: payment-service }
            # lidos pelo log estruturado (deployment.environment / host.name)
            - { name: ENVIRONMENT,       value: lab-k8s }
            - { name: HOSTNAME_LAB,      value: "$(NODE_NAME)" }
            - { name: ERROR_RATE,        value: "0.10" }
            - { name: LATENCY_JITTER_MS, value: "150" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://$(NODE_IP):4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: http/protobuf }
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=lab-k8s,k8s.pod.name=$(POD_NAME),k8s.namespace.name=$(POD_NAMESPACE),k8s.node.name=$(NODE_NAME)"
            - { name: APPDYNAMICS_AGENT_TIER_NAME, value: payment }
            - { name: APPDYNAMICS_AGENT_NODE_NAME, value: "$(POD_NAME)" }
          envFrom:
            - secretRef: { name: appd-creds }
          readinessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8082 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { memory: 512Mi }
