# Telegraf: le os registradores Modbus do process-sim e manda pro Splunk HEC
# como METRICA (serializer splunkmetric). O indice vem do token HEC (default
# ot_metrics) - mesmo padrao do collector de TI. Metrica, nao evento.
#
# ATENCAO TOML: em cada request, `tags` e `fields` sao INLINE. Nao use o
# sub-cabecalho [inputs.modbus.request.tags] seguido de `fields =` - o fields
# cai dentro de tags e o telegraf nao le campo nenhum.

[agent]
  interval = "${OT_POLL_INTERVAL}"
  flush_interval = "10s"
  omit_hostname = true

# -- Entrada: Modbus TCP do process-sim (um request por ativo, com tags) ------
[[inputs.modbus]]
  name = "ot-energia"
  slave_id = 1
  timeout = "2s"
  controller = "tcp://process-sim:502"
  configuration_type = "request"

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_subestacao"
    tags = { setor = "energia", subestacao = "SE-Centro" }
    fields = [
      { address = 0, name = "tensao_entrada_kv", type = "FLOAT32" },
      { address = 2, name = "potencia_total_mw", type = "FLOAT32" },
      { address = 4, name = "potencia_total_mvar", type = "FLOAT32" },
      { address = 6, name = "frequencia_hz", type = "FLOAT32" },
      { address = 8, name = "alimentadores_ativos", type = "FLOAT32" },
      { address = 10, name = "hora_do_dia", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_alimentador"
    tags = { setor = "energia", alimentador = "AL-01", nome = "Centro" }
    fields = [
      { address = 100, name = "tensao_pu", type = "FLOAT32" },
      { address = 102, name = "corrente_a", type = "FLOAT32" },
      { address = 104, name = "potencia_kw", type = "FLOAT32" },
      { address = 106, name = "potencia_kvar", type = "FLOAT32" },
      { address = 108, name = "carga_pct", type = "FLOAT32" },
      { address = 110, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_alimentador"
    tags = { setor = "energia", alimentador = "AL-02", nome = "Industrial" }
    fields = [
      { address = 120, name = "tensao_pu", type = "FLOAT32" },
      { address = 122, name = "corrente_a", type = "FLOAT32" },
      { address = 124, name = "potencia_kw", type = "FLOAT32" },
      { address = 126, name = "potencia_kvar", type = "FLOAT32" },
      { address = 128, name = "carga_pct", type = "FLOAT32" },
      { address = 130, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_alimentador"
    tags = { setor = "energia", alimentador = "AL-03", nome = "Residencial" }
    fields = [
      { address = 140, name = "tensao_pu", type = "FLOAT32" },
      { address = 142, name = "corrente_a", type = "FLOAT32" },
      { address = 144, name = "potencia_kw", type = "FLOAT32" },
      { address = 146, name = "potencia_kvar", type = "FLOAT32" },
      { address = 148, name = "carga_pct", type = "FLOAT32" },
      { address = 150, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_alimentador"
    tags = { setor = "energia", alimentador = "AL-04", nome = "Rural" }
    fields = [
      { address = 160, name = "tensao_pu", type = "FLOAT32" },
      { address = 162, name = "corrente_a", type = "FLOAT32" },
      { address = 164, name = "potencia_kw", type = "FLOAT32" },
      { address = 166, name = "potencia_kvar", type = "FLOAT32" },
      { address = 168, name = "carga_pct", type = "FLOAT32" },
      { address = 170, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_alimentador"
    tags = { setor = "energia", alimentador = "AL-05", nome = "Comercial" }
    fields = [
      { address = 180, name = "tensao_pu", type = "FLOAT32" },
      { address = 182, name = "corrente_a", type = "FLOAT32" },
      { address = 184, name = "potencia_kw", type = "FLOAT32" },
      { address = 186, name = "potencia_kvar", type = "FLOAT32" },
      { address = 188, name = "carga_pct", type = "FLOAT32" },
      { address = 190, name = "status", type = "FLOAT32" },
    ]

# -- Saida: Splunk HEC como metrica (indice vem do token, default ot_metrics) -
[[outputs.http]]
  url = "${SPLUNK_HEC_URL}"
  method = "POST"
  insecure_skip_verify = true
  data_format = "splunkmetric"
  splunkmetric_hec_routing = true
  [outputs.http.headers]
    Authorization = "Splunk ${SPLUNK_HEC_TOKEN}"
    Content-Type = "application/json"

