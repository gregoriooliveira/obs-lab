# Stack OT - setor ENERGIA (distribuicao). Autocontido: o process-sim gera o
# proprio dado, nada depende de equipamento real. Mesmo padrao do lab de TI -
# credenciais do Splunk por env var, nunca na imagem.
#
#   process-sim  modelo eletrico -> Modbus TCP (502) + HTTP de controle (8080)
#   telegraf     le o Modbus e manda pro Splunk HEC como metrica (ot_metrics)
#   fuxa         HMI/SCADA web (1881) lendo o mesmo Modbus
name: obs-lab-ot-energia

services:
  process-sim:
    build: { context: ./process-sim }
    image: obs-lab-ot-energia-sim:latest
    container_name: ot-energia-sim
    environment:
      SIM_DAY_MINUTES: "${SIM_DAY_MINUTES:-20}"   # curva de carga acelerada (vistoso)
      SIM_UPDATE_S: "${SIM_UPDATE_S:-5}"           # recalculo do modelo
      AUTO_FAULT: "${AUTO_FAULT:-true}"            # injeta falha sozinho
      AUTO_FAULT_PROB: "${AUTO_FAULT_PROB:-0.05}"
    ports:
      - "8091:8080"     # HTTP de controle (fault/snapshot), so pra operar o lab
    restart: unless-stopped
    networks: [ot-net]

  telegraf:
    image: telegraf:1.32
    container_name: ot-energia-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      OT_POLL_INTERVAL: "${OT_POLL_INTERVAL:-5s}"  # realista de SCADA
      SPLUNK_HEC_URL: "${SPLUNK_HEC_URL}"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN}"
    depends_on: [process-sim]
    restart: unless-stopped
    networks: [ot-net]

  fuxa:
    image: frangoteam/fuxa:latest
    container_name: ot-energia-hmi
    ports:
      - "1881:1881"     # HMI web: http://<host>:1881
    volumes:
      - fuxa-appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa-db:/usr/src/app/FUXA/server/_db
    depends_on: [process-sim]
    restart: unless-stopped
    networks: [ot-net]

networks:
  ot-net:
    driver: bridge

volumes:
  fuxa-appdata:
  fuxa-db:
