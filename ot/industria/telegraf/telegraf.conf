# Telegraf: le os registradores Modbus do process-sim industria e manda pro
# Splunk HEC como METRICA (serializer splunkmetric). O indice vem do token HEC
# (default ot_metrics) - mesmo padrao do collector de TI. Metrica, nao evento.
#
# ATENCAO TOML: em cada request, `tags` e `fields` sao INLINE. Nao use o
# sub-cabecalho [inputs.modbus.request.tags] seguido de `fields =` - o fields
# cai dentro de tags e o telegraf nao le campo nenhum.

[agent]
  interval = "${OT_POLL_INTERVAL}"
  flush_interval = "10s"
  omit_hostname = true

# -- Entrada: Modbus TCP do process-sim (um request por ativo, com tags) ------
[[inputs.modbus]]
  name = "ot-industria"
  slave_id = 1
  timeout = "2s"
  controller = "tcp://process-sim:502"
  configuration_type = "request"

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_planta"
    tags = { setor = "industria", planta = "PL-WEG" }
    fields = [
      { address = 0, name = "consumo_total_kw", type = "FLOAT32" },
      { address = 2, name = "producao_total_pph", type = "FLOAT32" },
      { address = 4, name = "motores_ativos", type = "FLOAT32" },
      { address = 6, name = "temperatura_ambiente_c", type = "FLOAT32" },
      { address = 8, name = "hora_do_dia", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_linha"
    tags = { setor = "industria", linha = "IN-01", nome = "Extrusao" }
    fields = [
      { address = 100, name = "corrente_a", type = "FLOAT32" },
      { address = 102, name = "temperatura_c", type = "FLOAT32" },
      { address = 104, name = "vibracao_mms", type = "FLOAT32" },
      { address = 106, name = "rpm", type = "FLOAT32" },
      { address = 108, name = "producao_pph", type = "FLOAT32" },
      { address = 110, name = "status", type = "FLOAT32" },
      { address = 112, name = "consumo_kw", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_linha"
    tags = { setor = "industria", linha = "IN-02", nome = "Prensa" }
    fields = [
      { address = 120, name = "corrente_a", type = "FLOAT32" },
      { address = 122, name = "temperatura_c", type = "FLOAT32" },
      { address = 124, name = "vibracao_mms", type = "FLOAT32" },
      { address = 126, name = "rpm", type = "FLOAT32" },
      { address = 128, name = "producao_pph", type = "FLOAT32" },
      { address = 130, name = "status", type = "FLOAT32" },
      { address = 132, name = "consumo_kw", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_linha"
    tags = { setor = "industria", linha = "IN-03", nome = "Fundicao" }
    fields = [
      { address = 140, name = "corrente_a", type = "FLOAT32" },
      { address = 142, name = "temperatura_c", type = "FLOAT32" },
      { address = 144, name = "vibracao_mms", type = "FLOAT32" },
      { address = 146, name = "rpm", type = "FLOAT32" },
      { address = 148, name = "producao_pph", type = "FLOAT32" },
      { address = 150, name = "status", type = "FLOAT32" },
      { address = 152, name = "consumo_kw", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_linha"
    tags = { setor = "industria", linha = "IN-04", nome = "Usinagem" }
    fields = [
      { address = 160, name = "corrente_a", type = "FLOAT32" },
      { address = 162, name = "temperatura_c", type = "FLOAT32" },
      { address = 164, name = "vibracao_mms", type = "FLOAT32" },
      { address = 166, name = "rpm", type = "FLOAT32" },
      { address = 168, name = "producao_pph", type = "FLOAT32" },
      { address = 170, name = "status", type = "FLOAT32" },
      { address = 172, name = "consumo_kw", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_linha"
    tags = { setor = "industria", linha = "IN-05", nome = "Montagem" }
    fields = [
      { address = 180, name = "corrente_a", type = "FLOAT32" },
      { address = 182, name = "temperatura_c", type = "FLOAT32" },
      { address = 184, name = "vibracao_mms", type = "FLOAT32" },
      { address = 186, name = "rpm", type = "FLOAT32" },
      { address = 188, name = "producao_pph", type = "FLOAT32" },
      { address = 190, name = "status", type = "FLOAT32" },
      { address = 192, name = "consumo_kw", type = "FLOAT32" },
    ]

# -- Entrada: contadores de producao via MQTT (fase 2) -----------------------
# O meter-sim publica uma leitura por contador em ot/industria/medidor/<ATIVO>.
# ativo, linha, tipo viram TAG; producao/pecas/tamper viram campo. A producao
# desviada NAO vem aqui - o Splunk a reconstroi do balanco (producao da linha, do
# Modbus, menos a soma dos contadores, daqui).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ot/industria/medidor/#"]
  qos = 0
  client_id = "telegraf-ot-industria"
  data_format = "json"
  name_override = "ot_contador"
  tag_keys = ["ativo", "conta_portal", "medidor", "linha", "tipo", "cidade"]
  # campos numericos (producao_pph, pecas_total, status, tamper, lat, lon) sao
  # capturados automaticamente pelo parser json.

# -- Entrada: EVENTOS de seguranca/operacao via MQTT -------------------------
# process-sim (unauth_command, spoof, superaquecimento...) e meter-sim (tamper)
# publicam em ot/industria/evento/<categoria>. Isto NAO e metrica - vai como
# EVENTO pro indice ot. A tag telemetria=evento roteia a saida certa.
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ot/industria/evento/#"]
  qos = 0
  client_id = "telegraf-ot-ind-eventos"
  data_format = "json"
  name_override = "ot_evento"
  tag_keys = ["evento", "categoria", "severidade", "linha", "tipo",
              "ativo", "conta_portal", "medidor"]
  json_string_fields = ["msg"]
  [inputs.mqtt_consumer.tags]
    telemetria = "evento"

# -- Saida 1: metrica -> Splunk HEC (indice vem do token, default ot_metrics) -
[[outputs.http]]
  url = "${SPLUNK_HEC_URL}"
  method = "POST"
  insecure_skip_verify = true
  data_format = "splunkmetric"
  splunkmetric_hec_routing = true
  [outputs.http.headers]
    Authorization = "Splunk ${SPLUNK_HEC_TOKEN}"
    Content-Type = "application/json"
  [outputs.http.tagdrop]
    telemetria = ["evento"]   # evento sai pela outra saida, nao como metrica

# -- Saida 2: evento -> Splunk HEC /raw no indice ot -------------------------
# Usa o mesmo token (precisa permitir os indices ot_metrics E ot). O endpoint
# /raw indexa o JSON como evento; index/sourcetype vao na query.
[[outputs.http]]
  url = "${SPLUNK_HEC_URL}/raw?index=ot&sourcetype=ot:evento"
  method = "POST"
  insecure_skip_verify = true
  data_format = "json"
  [outputs.http.headers]
    Authorization = "Splunk ${SPLUNK_HEC_TOKEN}"
    Content-Type = "application/json"
  [outputs.http.tagpass]
    telemetria = ["evento"]

