# Telegraf: le os registradores Modbus do process-sim de gas e manda pro Splunk
# HEC como METRICA (serializer splunkmetric). O indice vem do token HEC (default
# ot_metrics) - mesmo padrao do collector de TI. Metrica, nao evento.
#
# ATENCAO TOML: em cada request, `tags` e `fields` sao INLINE. Nao use o
# sub-cabecalho [inputs.modbus.request.tags] seguido de `fields =` - o fields
# cai dentro de tags e o telegraf nao le campo nenhum.

[agent]
  interval = "${OT_POLL_INTERVAL}"
  flush_interval = "10s"
  omit_hostname = true

# -- Entrada: Modbus TCP do process-sim (um request por ativo, com tags) ------
[[inputs.modbus]]
  name = "ot-gas"
  slave_id = 1
  timeout = "2s"
  controller = "tcp://process-sim:502"
  configuration_type = "request"

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_estacao"
    tags = { setor = "gas", estacao = "CG-Centro" }
    fields = [
      { address = 0, name = "pressao_entrada_bar", type = "FLOAT32" },
      { address = 2, name = "vazao_entrada_m3h", type = "FLOAT32" },
      { address = 4, name = "pressao_saida_mbar", type = "FLOAT32" },
      { address = 6, name = "temperatura_c", type = "FLOAT32" },
      { address = 8, name = "odorizacao_mgm3", type = "FLOAT32" },
      { address = 10, name = "zonas_ativas", type = "FLOAT32" },
      { address = 12, name = "hora_do_dia", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_zona"
    tags = { setor = "gas", zona = "GS-01", nome = "Centro" }
    fields = [
      { address = 100, name = "pressao_mbar", type = "FLOAT32" },
      { address = 102, name = "vazao_m3h", type = "FLOAT32" },
      { address = 104, name = "consumo_m3h", type = "FLOAT32" },
      { address = 106, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_zona"
    tags = { setor = "gas", zona = "GS-02", nome = "Industrial" }
    fields = [
      { address = 120, name = "pressao_mbar", type = "FLOAT32" },
      { address = 122, name = "vazao_m3h", type = "FLOAT32" },
      { address = 124, name = "consumo_m3h", type = "FLOAT32" },
      { address = 126, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_zona"
    tags = { setor = "gas", zona = "GS-03", nome = "Residencial" }
    fields = [
      { address = 140, name = "pressao_mbar", type = "FLOAT32" },
      { address = 142, name = "vazao_m3h", type = "FLOAT32" },
      { address = 144, name = "consumo_m3h", type = "FLOAT32" },
      { address = 146, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_zona"
    tags = { setor = "gas", zona = "GS-04", nome = "Rural" }
    fields = [
      { address = 160, name = "pressao_mbar", type = "FLOAT32" },
      { address = 162, name = "vazao_m3h", type = "FLOAT32" },
      { address = 164, name = "consumo_m3h", type = "FLOAT32" },
      { address = 166, name = "status", type = "FLOAT32" },
    ]

  [[inputs.modbus.request]]
    slave_id = 1
    byte_order = "ABCD"
    register = "holding"
    measurement = "ot_zona"
    tags = { setor = "gas", zona = "GS-05", nome = "Comercial" }
    fields = [
      { address = 180, name = "pressao_mbar", type = "FLOAT32" },
      { address = 182, name = "vazao_m3h", type = "FLOAT32" },
      { address = 184, name = "consumo_m3h", type = "FLOAT32" },
      { address = 186, name = "status", type = "FLOAT32" },
    ]

# -- Entrada: medidores de gas via MQTT (fase 2) -----------------------------
# O meter-sim publica uma leitura por medidor em ot/gas/medidor/<UC>. uc, zona e
# classe viram TAG; vazao/volume/pressao/tamper viram campo. A perda nao-tecnica
# NAO vem aqui - o Splunk a reconstroi do balanco (vazao da zona, do Modbus,
# menos a soma dos medidores, daqui).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ot/gas/medidor/#"]
  qos = 0
  client_id = "telegraf-ot-gas"
  data_format = "json"
  name_override = "ot_medidor_gas"
  tag_keys = ["uc", "conta_portal", "medidor", "zona", "classe", "cidade"]
  # campos numericos (vazao_m3h, volume_m3, pressao_mbar, status, tamper, lat,
  # lon) sao capturados automaticamente pelo parser json.

# -- Entrada: EVENTOS de seguranca/operacao via MQTT -------------------------
# process-sim (unauth_command, spoof, odorizacao_off, vazamento...) e meter-sim
# (tamper) publicam em ot/gas/evento/<categoria>. Isto NAO e metrica - vai como
# EVENTO pro indice ot. A tag telemetria=evento roteia a saida certa (abaixo).
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["ot/gas/evento/#"]
  qos = 0
  client_id = "telegraf-ot-gas-eventos"
  data_format = "json"
  name_override = "ot_evento"
  tag_keys = ["evento", "categoria", "severidade", "feeder", "tipo",
              "uc", "conta_portal", "medidor", "zona", "classe"]
  json_string_fields = ["msg"]
  [inputs.mqtt_consumer.tags]
    telemetria = "evento"

# -- Saida 1: metrica -> Splunk HEC (indice vem do token, default ot_metrics) -
[[outputs.http]]
  url = "${SPLUNK_HEC_URL}"
  method = "POST"
  insecure_skip_verify = true
  data_format = "splunkmetric"
  splunkmetric_hec_routing = true
  [outputs.http.headers]
    Authorization = "Splunk ${SPLUNK_HEC_TOKEN}"
    Content-Type = "application/json"
  [outputs.http.tagdrop]
    telemetria = ["evento"]   # evento sai pela outra saida, nao como metrica

# -- Saida 2: evento -> Splunk HEC /raw no indice ot -------------------------
# Usa o mesmo token (precisa permitir os indices ot_metrics E ot). O endpoint
# /raw indexa o JSON como evento; index/sourcetype vao na query.
[[outputs.http]]
  url = "${SPLUNK_HEC_URL}/raw?index=ot&sourcetype=ot:evento"
  method = "POST"
  insecure_skip_verify = true
  data_format = "json"
  [outputs.http.headers]
    Authorization = "Splunk ${SPLUNK_HEC_TOKEN}"
    Content-Type = "application/json"
  [outputs.http.tagpass]
    telemetria = ["evento"]

