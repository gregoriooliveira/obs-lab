# Stack OT - setor GAS (distribuicao de gas canalizado). Autocontido: o
# process-sim gera o proprio dado, nada depende de equipamento real. Mesmo padrao
# do lab de TI - credenciais do Splunk por env var, nunca na imagem.
#
#   process-sim  modelo da rede -> Modbus TCP (502) + HTTP de controle (8080)
#   meter-sim    medidores de gas -> consumo por MQTT (furto/tamper)
#   mosquitto    broker MQTT (medidores -> Telegraf)
#   telegraf     le Modbus + MQTT e manda pro Splunk HEC como metrica (ot_metrics)
#   fuxa         HMI/SCADA web (1881) lendo o mesmo Modbus
name: obs-lab-ot-gas

services:
  process-sim:
    build: { context: ./process-sim }
    image: obs-lab-ot-gas-sim:latest
    container_name: ot-gas-sim
    environment:
      SIM_DAY_MINUTES: "${SIM_DAY_MINUTES:-20}"   # curva de consumo acelerada (vistoso)
      SIM_UPDATE_S: "${SIM_UPDATE_S:-5}"           # recalculo do modelo
      AUTO_FAULT: "${AUTO_FAULT:-true}"            # injeta falha sozinho
      AUTO_FAULT_PROB: "${AUTO_FAULT_PROB:-0.05}"
      CYBER_FAULT_PROB: "${CYBER_FAULT_PROB:-0.25}"  # fracao das falhas que e cyber
      MQTT_HOST: "mosquitto"                       # eventos de seguranca/operacao
    ports:
      - "8095:8080"     # HTTP de controle (fault/snapshot), so pra operar o lab
    depends_on: [mosquitto]
    restart: unless-stopped
    networks: [ot-net]

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ot-gas-mqtt
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks: [ot-net]

  meter-sim:
    build: { context: ., dockerfile: meter-sim/Dockerfile }   # precisa de lookups/
    image: obs-lab-ot-gas-meter:latest
    container_name: ot-gas-meter
    environment:
      PROCESS_SIM_URL: "http://process-sim:8080"   # le a vazao das zonas
      MQTT_HOST: "mosquitto"
      METER_POLL_S: "${METER_POLL_S:-5}"
    ports:
      - "8096:8080"     # HTTP de controle (fraude/snapshot), so pra operar o lab
    depends_on: [process-sim, mosquitto]
    restart: unless-stopped
    networks: [ot-net]

  telegraf:
    image: telegraf:1.32
    container_name: ot-gas-telegraf
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      OT_POLL_INTERVAL: "${OT_POLL_INTERVAL:-5s}"  # realista de SCADA
      SPLUNK_HEC_URL: "${SPLUNK_HEC_URL}"
      SPLUNK_HEC_TOKEN: "${SPLUNK_HEC_TOKEN}"
    depends_on: [process-sim, mosquitto]
    restart: unless-stopped
    networks: [ot-net]

  fuxa:
    image: frangoteam/fuxa:latest
    container_name: ot-gas-hmi
    ports:
      - "1883:1881"     # HMI web: http://<host>:1883 (1881 no energia ja usa)
    volumes:
      - fuxa-appdata:/usr/src/app/FUXA/server/_appdata
      - fuxa-db:/usr/src/app/FUXA/server/_db
    depends_on: [process-sim]
    restart: unless-stopped
    networks: [ot-net]

networks:
  ot-net:
    driver: bridge

volumes:
  fuxa-appdata:
  fuxa-db:
