# Apenas Splunk – OTel collector agent nos 3 serviços
services:
  gateway-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://splunk-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  orders-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://splunk-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  payment-service:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://splunk-otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf

  splunk-otel-collector:
    image: quay.io/signalfx/splunk-otel-collector:latest
    container_name: obs-splunk-otel
    user: "0:0"
    command: ["--config=/etc/otel/collector/custom_config.yaml"]
    environment:
      SPLUNK_ACCESS_TOKEN:     "${SPLUNK_ACCESS_TOKEN}"
      SPLUNK_REALM:            "${SPLUNK_REALM:-us0}"
      SPLUNK_MEMORY_TOTAL_MIB: "512"
      ENVIRONMENT:             "${ENVIRONMENT:-lab}"
    volumes:
      - ./splunk-otel-collector/config.yml:/etc/otel/collector/custom_config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /etc:/hostfs/etc:ro
    ports: ["4317:4317","4318:4318","8888:8888","13133:13133","55679:55679"]
    restart: unless-stopped
    networks: [obs-net]
